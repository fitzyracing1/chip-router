# chip-router catalog
# Hardware numbers come from vendor datasheets or official product pages.
# Tensor throughputs are stored as dense (no structured sparsity) TFLOPS
# whenever the vendor publishes both, so chips can be compared fairly.
# Sparse peaks are included for reference.
# Provider prices are public on-demand list rates with a retrieval date and
# source URL. They are not quotes, they can change, and they are never
# invented. Missing offers mean no public list price was found on that
# provider — not a zero-dollar price.

schema_version: 1
updated: "2026-11-13"
notes: >
  Default on-demand rates: RunPod Secure Cloud (pricing page updated
  2026-11-12); Modal GPU-only per-second rates converted to $/hr;
  Lambda 1x instance prices published for 2026-11-16 00:00 UTC (not yet
  in effect at catalog time). Modal also bills CPU and memory separately.

