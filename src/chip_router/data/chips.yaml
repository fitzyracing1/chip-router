  - id: nvidia-rtx-4090
    name: NVIDIA GeForce RTX 4090
    vendor: NVIDIA
    architecture: Ada Lovelace
    form_factor: PCIe
    software: cuda
    memory_gb: 24
    memory_type: GDDR6X
    memory_bandwidth_gbs: 1008
    bf16_tflops_dense: 330.25
    bf16_tflops_sparse: 660.5
    fp8_tflops_dense: 660.5
    fp8_tflops_sparse: 1321
    fp8_supported: true
    throughput_derivation: >
      Memory capacity and 1008 GB/s bandwidth are from the official
      GeForce RTX 4090 product page. NVIDIA publishes 1,321 AI TOPS
      for this card; this catalog treats that as the sparse FP8 / AI
      TOPS peak. Dense FP8 is stored as half of 1,321 (NVIDIA 2:4
      structured sparsity). Dense BF16 is stored as half of dense FP8
      (Ada FP8 tensor rate is 2x BF16/FP16). Derived fields are used
      only so scoring stays on a dense basis; see sources.
    sources:
      - title: NVIDIA GeForce RTX 4090 product page
        url: "https://www.nvidia.com/en-us/geforce/graphics-cards/40-series/rtx-4090/"
        retrieved: "2026-11-13"
        notes: "24 GB GDDR6X, 1008 GB/s memory bandwidth."
      - title: NVIDIA GeForce RTX 40 Series announcement
        url: "https://nvidianews.nvidia.com/news/nvidia-delivers-quantum-leap-in-performance-introduces-new-era-of-neural-rendering-with-geforce-rtx-40-series"
        retrieved: "2026-11-13"
        notes: "NVIDIA published the 1,321 AI TOPS figure for the RTX 4090."
    offers:
