name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Validate catalog
        run: chip-router validate
      - name: Tests
        run: pytest
      - name: Example picks
        run: |
          chip-router pick examples/infer-8b.yaml --no-log
          chip-router pick examples/infer-70b.yaml --no-log
          chip-router pick examples/finetune-13b.yaml --no-log
          chip-router pick examples/signal-processing.yaml --no-log --plan
