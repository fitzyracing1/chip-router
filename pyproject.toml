[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-router"
version = "0.1.0"
description = "Pick the AI chip each job runs on, on purpose."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Almeida" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp>=1.2"]

[project.scripts]
chip-router = "chip_router.cli:main"

[project.urls]
Homepage = "https://github.com/fitzyracing1/chip-router"
Issues = "https://github.com/fitzyracing1/chip-router/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chip_router = ["data/chips.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
